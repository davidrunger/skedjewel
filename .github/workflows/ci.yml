name: Build and Test

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Crystal
        uses: crystal-lang/install-crystal@19ef8675e43f44f0d38b79f732df7ad4b6b669ed # v1.9.4

      - name: Verify Crystal version
        run: ./bin/ci/verify-crystal-version.sh

      - name: Cache shards
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lib
          key: ${{ runner.os }}-shards-${{ hashFiles('**/shard.lock') }}

      - name: Install shards
        run: shards check || shards install

      - name: Cache ameba
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/ameba
          key: ${{ runner.os }}-ameba-v1-${{ hashFiles('.crystal-version', 'bin/ameba.cr', '**/shard.lock') }}

      - name: Force ameba rebuild if needed
        run: '[ -f bin/ameba ] || crystal build -o bin/ameba bin/ameba.cr'

      - name: Run Ameba
        run: bin/ameba

      - name: Build exe/skedjewel.cr
        run: crystal build exe/skedjewel.cr

      - name: Run tests
        run: crystal spec
