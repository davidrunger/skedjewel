name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  attestations: write # Permit publishing the build provenance attestation.
  contents: write # Permit creating the release and uploading its assets.
  id-token: write # Permit signing the build provenance attestation.

jobs:
  build_and_release_linux_binary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1.9.2

      - name: Verify Crystal version
        run: |
          version=$(cat .crystal-version)
          escaped_version=$(sed 's/\./\\./g' <<< "$version")
          [[ "$(crystal --version)" =~ ^Crystal\ ${escaped_version}\  ]]

      - name: Build
        run: shards build --production --release --no-debug --static

      - name: Check version matches tag
        run: "[[ v$(bin/skedjewel --version | cut -d' ' -f2) == ${{ github.ref_name }} ]]"

      - name: Move and rename
        run: mv bin/skedjewel ./skedjewel-${{ github.ref_name }}-linux

      - name: Generate build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: skedjewel-${{ github.ref_name }}-linux

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "skedjewel-$TAG-linux" \
            --repo "$REPO" \
            --generate-notes \
            --verify-tag
